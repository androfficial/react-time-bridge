<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Time Bridge - Convert time between timezones and plan meetings across the globe. A modern, accessible web app for international teams."
    />
    <meta
      name="keywords"
      content="timezone converter, meeting planner, time zones, international meetings, world clock, time conversion"
    />
    <meta name="author" content="Andrii Nakonechnyi" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Time Bridge | Timezone Converter & Meeting Planner"
    />
    <meta
      property="og:description"
      content="Convert time between timezones and plan meetings across the globe. Perfect for international teams."
    />
    <meta
      property="og:url"
      content="https://react-time-bridge.vercel.app"
    />
    <meta property="og:site_name" content="Time Bridge" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Time Bridge | Timezone Converter & Meeting Planner"
    />
    <meta
      name="twitter:description"
      content="Convert time between timezones and plan meetings across the globe."
    />

    <!-- Theme Color -->
    <meta
      name="theme-color"
      content="#6366f1"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#4f46e5"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/vite.svg" />

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Time Bridge | Timezone Converter & Meeting Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
